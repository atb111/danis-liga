<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Danis Liga">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Danis Körper-Liga</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--y:#fceb01;--k:#111;--navy:#1f3a5f;--gr:#a9232e;--grd:#7a1a22;--nb:#082654;--gold:#d9a441;
 --head:"DIN Condensed","Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
 --body:"Avenir Next","Segoe UI","Trebuchet MS",system-ui,-apple-system,Helvetica,Arial,sans-serif;
 --acc:#fceb01;--accT:#111;--dark:#111}
html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#222;font-family:var(--body);
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
body.t-fb{--acc:#fceb01;--accT:#111;--dark:#111}
body.t-bb{--acc:#a9232e;--accT:#fff;--dark:#082654}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.active{display:flex}

/* ---------- HOME ---------- */
#scr-home{background:#0d0d0d;color:#fff;align-items:center}
.home-top{width:100%;max-width:1040px;display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.pill{background:rgba(255,255,255,.12);border-radius:999px;padding:8px 14px;font-weight:700;font-size:18px;color:#fff;border:none}
.hero{width:100%;max-width:1040px;padding:4px 16px 0;text-align:center}
.hero h1{font-family:var(--head);font-weight:900;text-transform:uppercase;font-size:clamp(34px,7vw,64px);margin:0;line-height:1;
 background:linear-gradient(90deg,#fceb01 0%,#fceb01 45%,#e04050 55%,#d9a441 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:8px 0 6px;font-size:clamp(15px,2.6vw,20px);opacity:.9}
.leagues{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;width:100%;max-width:1040px;padding:12px 16px 10px}
.league{border-radius:22px;padding:14px;position:relative;overflow:hidden}
.league.fb{background:repeating-linear-gradient(135deg,#151515 0 26px,#1c1c1c 26px 52px);border:3px solid var(--y)}
.league.bb{background:linear-gradient(160deg,var(--gr),var(--grd) 55%,var(--nb));border:3px solid var(--gold)}
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lhead svg{width:60px;height:60px;flex-shrink:0}
.lhead .lt{font-family:var(--head);font-weight:900;font-size:26px;text-transform:uppercase;line-height:1}
.lhead .ls{font-size:14px;opacity:.85}
.league.fb .lt{color:var(--y)}.league.bb .lt{color:#fff}
.lv{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:16px;padding:12px;margin-top:10px;text-align:left;color:inherit;position:relative;box-shadow:0 5px 0 rgba(0,0,0,.4);transition:transform .1s}
.lv:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.league.fb .lv{background:var(--y);color:#111}
.league.bb .lv{background:#fff;color:var(--nb)}
.lv .lic{font-size:42px;line-height:1;width:54px;text-align:center}
.lv .lnum{font-family:var(--head);font-size:14px;font-weight:800;text-transform:uppercase;opacity:.75}
.lv .lname{font-family:var(--head);font-size:23px;font-weight:900;text-transform:uppercase;line-height:1.05}
.lv .ltopic{font-size:14px;margin-top:2px}
.lv .lstars{margin-left:auto;font-size:20px;white-space:nowrap}
.lv.locked{filter:grayscale(1) brightness(.55)}
.lv.locked .lstars::after{content:" 🔒"}
.lv .lgame{position:absolute;top:-8px;right:-6px;background:#111;color:#fff;border:2px solid #fff;border-radius:12px;font-size:18px;padding:2px 7px}
.home-foot{font-size:12px;opacity:.6;padding:6px 0 20px;text-align:center}
.home-foot button{background:none;border:none;color:#fff;text-decoration:underline;font-size:12px;opacity:.8}

/* ---------- QUIZ ---------- */
#scr-quiz{align-items:center}
body.t-fb #scr-quiz{background:repeating-linear-gradient(135deg,#111 0 34px,#1a1a1a 34px 68px)}
body.t-bb #scr-quiz{background:radial-gradient(circle at 50% 120%,var(--gr) 0%,var(--grd) 40%,var(--nb) 100%)}
.qbar{width:100%;max-width:920px;display:flex;align-items:center;gap:8px;padding:10px 12px 4px;color:#fff}
.iconbtn{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:12px;font-size:20px;min-width:46px;height:46px;padding:0 10px}
.qtitle{flex:1;display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:900;text-transform:uppercase;font-size:clamp(17px,3vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtitle svg{width:38px;height:38px;flex-shrink:0}
body.t-fb .qtitle{color:var(--y)}
.coins{background:rgba(255,255,255,.14);border-radius:999px;padding:8px 14px;font-weight:800;font-size:18px}
.progress{width:100%;max-width:920px;display:flex;gap:6px;padding:4px 12px 8px}
.progress span{flex:1;height:12px;border-radius:6px;background:rgba(255,255,255,.25)}
.progress span.cur{background:#fff;box-shadow:0 0 8px #fff}
.progress span.ok{background:#2ecc71}.progress span.meh{background:#ffb300}.progress span.no{background:#e74c3c}
.qwrap{width:100%;max-width:920px;padding:0 10px 18px;flex:1}
.card{background:#fff;border-radius:20px;box-shadow:0 8px 0 rgba(0,0,0,.35);padding:16px 16px 18px;position:relative;border-top:8px solid var(--acc)}
body.t-bb .card{border-top-color:var(--gold)}
.card.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.95);opacity:.3}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.qnum{font-family:var(--head);font-size:14px;font-weight:800;color:#888;text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
.qtype{background:var(--dark);color:#fff;border-radius:8px;padding:2px 8px;font-size:13px}
body.t-fb .qtype{background:#111;color:var(--y)}
.prompt{font-size:clamp(19px,3.3vw,26px);font-weight:700;margin:8px 0 12px;line-height:1.4}
.hl{background:#fff59d;padding:0 5px;border-radius:5px}
body.t-bb .hl{background:#ffe0b2}
.visual{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px}
.answer{margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:12px}
.big-btn{font-size:21px;font-weight:800;padding:13px 24px;border-radius:14px;border:none;background:#2ecc71;color:#fff;box-shadow:0 5px 0 #1e8e4e;font-family:var(--body)}
.big-btn:disabled{opacity:.35}
.big-btn.alt{background:var(--dark);box-shadow:0 5px 0 #000;color:#fff}
body.t-fb .big-btn.alt{background:#111;color:var(--y)}
.big-btn.ghost{background:#eceff1;color:#333;box-shadow:0 5px 0 #b0bec5}
.big-btn:active{transform:translateY(3px)}
.feedback{margin-top:12px;border-radius:14px;font-size:clamp(16px,2.8vw,20px);font-weight:600;text-align:center;line-height:1.45}
.feedback:empty{display:none}
.feedback.good{background:#e8f5e9;color:#1b5e20;padding:12px}
.feedback.hint{background:#fff8e1;color:#7a4f00;padding:12px}
.feedback.sol{background:#ffebee;color:#b71c1c;padding:12px}
.feedback .info{display:block;font-weight:500;color:#333;margin-top:6px;font-size:.92em}
.feedback .big-btn{margin-top:10px}
/* body svg */
.body{width:min(300px,62vw);height:auto;touch-action:manipulation}
.body.tap .hit{cursor:pointer}
.org{transition:filter .2s}
.org.glow{filter:drop-shadow(0 0 6px #ffd600) drop-shadow(0 0 3px #ffd600)}
.org.okg{filter:drop-shadow(0 0 6px #00c853) drop-shadow(0 0 4px #00c853)}
.org.badg{filter:drop-shadow(0 0 6px #ff1744) drop-shadow(0 0 4px #ff1744)}
/* options */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:680px}
.opts.one{grid-template-columns:1fr}
.opt{font-size:clamp(17px,3vw,22px);font-weight:700;min-height:62px;border-radius:14px;border:3px solid var(--dark);background:#f7f7f7;color:#222;padding:8px 12px;box-shadow:0 4px 0 #bbb;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25}
body.t-bb .opt{border-color:var(--gr)}
.opt:active{transform:translateY(3px)}
.opt:disabled{opacity:.3}
.opt.right{background:#b9f6ca;border-color:#2ecc71}
.tfrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.tfbtn{font-size:24px;font-weight:900;min-width:150px;height:72px;border-radius:16px;border:none;color:#fff;font-family:var(--head);text-transform:uppercase;letter-spacing:1px}
.tfbtn.r{background:#2ecc71;box-shadow:0 5px 0 #1e8e4e}.tfbtn.f{background:#e53935;box-shadow:0 5px 0 #9a1d1a}
.tfbtn:disabled{opacity:.3}
.stmt{font-size:clamp(19px,3.3vw,25px);font-weight:700;background:#fffde7;border-left:8px solid var(--acc);border-radius:12px;padding:14px 16px;line-height:1.4;width:100%}
body.t-fb .stmt{border-left-color:#111}
/* chips / blocks */
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:6px 14px;border-radius:12px;border:3px solid #ff9100;background:#fff3e0;font-size:clamp(17px,3vw,22px);font-weight:700;color:#222;box-shadow:0 4px 0 #ffb74d}
.chip:active{transform:translateY(3px)}
.chip.used{visibility:hidden}
.chip.ok{border-color:#2ecc71;background:#e8f5e9;box-shadow:0 4px 0 #81c784}
.pool{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;width:100%}
.line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:70px;width:100%;padding:10px;border-radius:14px;background:#f1f4ff;border:3px dashed #9fa8da}
.line:empty::before{content:"Tippe die Wörter in der richtigen Reihenfolge an …";color:#999;font-size:16px}
.line .chip{border-color:#3949ab;background:#e8eaf6;box-shadow:0 4px 0 #9fa8da}
.line .chip.ok{border-color:#2ecc71;background:#e8f5e9}
/* gap text */
.gaptext{font-size:clamp(19px,3.2vw,25px);line-height:2.2;font-weight:600;background:#fafafa;border-radius:14px;padding:10px 14px;width:100%}
.gap{display:inline-block;min-width:110px;text-align:center;border-bottom:4px solid #9e9e9e;border-radius:6px;padding:0 8px;color:#999;background:#fff;line-height:1.5;cursor:pointer}
.gap.sel{border-color:#ff9100;background:#fff3e0;color:#ff6d00}
.gap.ok{border-color:#2ecc71;color:#1b5e20;background:#e8f5e9}
/* match */
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:10px 14px;width:100%}
.match .col{display:flex;flex-direction:column;gap:10px}
.mi{border:3px solid #bbb;border-radius:14px;background:#fafafa;padding:10px 12px;font-size:clamp(15px,2.6vw,19px);font-weight:700;min-height:58px;display:flex;align-items:center;gap:8px;text-align:left;color:#222;line-height:1.25;box-shadow:0 3px 0 #ccc}
.mi.L{font-family:var(--head);text-transform:uppercase;font-size:clamp(18px,3vw,23px)}
.mi.sel{border-color:#ff9100;background:#fff3e0}
.mi .dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;background:#ddd}
/* classify */
.cls-item{font-size:clamp(50px,9vw,76px);line-height:1;text-align:center}
.cls-name{font-size:clamp(20px,3.4vw,26px);font-weight:800;text-align:center;margin-top:4px}
.buckets{display:grid;gap:10px;width:100%;max-width:720px}
.bucket{border-radius:16px;border:none;color:#fff;font-weight:800;font-size:clamp(17px,3vw,21px);padding:10px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.bucket .bi{font-size:22px;min-height:26px;letter-spacing:2px}
.bucket:active{transform:translateY(3px)}
/* write */
.write{width:100%;font-size:clamp(19px,3.2vw,24px);font-family:var(--body);border:3px solid var(--dark);border-radius:14px;padding:12px;min-height:110px;resize:vertical;-webkit-user-select:text;user-select:text}
body.t-bb .write{border-color:var(--gr)}
.ukeys{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ukey{font-size:22px;font-weight:800;width:52px;height:46px;border-radius:10px;border:none;background:#eceff1;box-shadow:0 3px 0 #b0bec5}
.modesw{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.modesw button{border:2px solid #bbb;background:#fff;border-radius:999px;padding:8px 14px;font-size:16px;font-weight:700;color:#444}
.modesw button.on{background:var(--dark);border-color:var(--dark);color:#fff}
body.t-fb .modesw button.on{background:#111;color:var(--y)}
.model{background:#e3f2fd;border-radius:12px;padding:10px 12px;font-weight:700;color:#0d47a1;display:block;margin-top:8px}
/* multi */
.multi{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;width:100%}
.mo{border:3px solid #ccc;border-radius:14px;background:#fff;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:17px;box-shadow:0 3px 0 #ddd;color:#222;text-align:center;line-height:1.2}
.mo .e{font-size:42px;line-height:1}
.mo.sel{border-color:#ff9100;background:#fff3e0}
.mo.ok{border-color:#2ecc71;background:#e8f5e9}
.mo.miss{border-color:#2ecc71;border-style:dashed}
.mo.bad{border-color:#e53935;background:#ffebee}
/* order */
.ord-slots{display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px}
.ord-slot{display:flex;align-items:center;gap:10px;min-height:54px;border-radius:14px;background:#f1f4ff;border:3px dashed #9fa8da;padding:4px 10px;font-size:20px;font-weight:700}
.ord-slot .n{font-family:var(--head);font-size:26px;font-weight:900;color:#3949ab;width:30px}
.ord-slot.filled{border-style:solid;border-color:#3949ab;background:#e8eaf6}
.ord-slot.ok{border-color:#2ecc71;background:#e8f5e9}

/* ---------- LERNKARTE ---------- */
.lern{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.lern .ltext{flex:1;min-width:240px;font-size:clamp(18px,3vw,22px);line-height:1.5}
.lern .ltext b{background:#fff59d;padding:0 4px;border-radius:4px}
body.t-bb .lern .ltext b{background:#ffe0b2}
.lern .ltitle{font-family:var(--head);font-weight:900;text-transform:uppercase;font-size:clamp(24px,4.4vw,34px);margin:0 0 6px;color:var(--dark)}
.lern .lemo{font-size:60px;line-height:1;text-align:center}
.dots{display:flex;gap:8px;justify-content:center;margin-top:10px}
.dots span{width:12px;height:12px;border-radius:50%;background:#ccc}
.dots span.on{background:var(--dark)}
.station-lbl{font-family:var(--head);font-weight:900;font-size:22px;text-transform:uppercase;text-align:center;min-height:30px;color:var(--dark)}

/* ---------- MODAL ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.show{display:flex}
.mbox{background:#fff;border-radius:22px;max-width:580px;width:100%;padding:20px 18px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.35);animation:pop .35s;max-height:94vh;overflow-y:auto;border-top:10px solid var(--acc)}
body.t-bb .mbox{border-top-color:var(--gold)}
.mbox h2{margin:6px 0;font-family:var(--head);text-transform:uppercase;font-size:clamp(26px,5vw,36px);line-height:1.05}
.mbox p{font-size:clamp(16px,3vw,20px);line-height:1.45;margin:8px 0}
.mbox .micon{font-size:64px;line-height:1.1}
.mbox .mcrest svg{width:86px;height:86px}
.mbox .mstars{font-size:50px;letter-spacing:6px;color:#f9a825}
.mbox .btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:14px}
.gloss{text-align:left;columns:2;column-gap:20px;font-size:16px;line-height:1.7}
.gloss div{break-inside:avoid}
@media (max-width:520px){.gloss{columns:1}}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- GAME ---------- */
#scr-game{background:#000;overflow:hidden}
.gbar{display:flex;align-items:center;gap:10px;padding:6px 10px;color:#fff;flex-shrink:0}
.gbar .gt{flex:1;font-family:var(--head);font-weight:900;text-transform:uppercase;font-size:20px}
#g-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#cv{display:block;background:#000;touch-action:none;border-radius:6px}
#g-over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:5;padding:10px}
#g-over.show{display:flex}
#g-pad{display:flex;justify-content:flex-end;align-items:flex-end;padding:8px 14px 14px;gap:10px;flex-shrink:0}
#g-pad:empty{display:none}
.pbtn{min-width:120px;height:96px;border-radius:48px;border:4px solid rgba(255,255,255,.85);background:rgba(169,35,46,.8);color:#fff;font-size:28px;font-weight:900;touch-action:none;font-family:var(--head);text-transform:uppercase;padding:0 22px}
.pbtn.on{background:rgba(255,255,255,.55)}
@media (orientation:landscape) and (max-height:560px){
 #g-pad{position:absolute;right:0;bottom:0;pointer-events:none;padding:8px 16px calc(8px + env(safe-area-inset-bottom))}
 .pbtn{pointer-events:auto;opacity:.85;height:84px}
 .gbar{position:absolute;top:0;left:0;z-index:4;padding:4px}
 .gbar .gt{display:none}
}
@media (max-height:760px){.body{width:min(250px,55vw)}}
</style>
</head>
<body class="t-fb">

<section id="scr-home" class="screen active">
  <div class="home-top">
    <span class="pill" id="h-coins">🪙 0</span>
    <span>
      <button class="pill" id="h-gloss">📖</button>
      <button class="pill" id="h-sound">🔊</button>
    </span>
  </div>
  <div class="hero">
    <h1 id="h-title">Danis Körper-Liga</h1>
    <p>Die Reise des Essens · Ernährung · Gesundheit ⚽🏀</p>
  </div>
  <div class="leagues" id="leagues"></div>
  <div id="ios-tip" style="display:none;max-width:640px;margin:0 16px 12px;background:rgba(255,255,255,.12);border-radius:16px;padding:12px 16px;font-size:16px;text-align:center">📲 <b>Tipp:</b> Tippe auf <b>Teilen</b> (□↑) → <b>„Zum Home-Bildschirm“</b>. Dann ist das Spiel eine App und dein Fortschritt bleibt gespeichert! <button id="ios-tip-x" style="background:none;border:none;color:#fff;font-size:18px">✕</button></div>
  <div class="home-foot">Schaffe ein Level, um das nächste und das Bonus-Spiel freizuschalten.<br><button id="h-reset">Fortschritt zurücksetzen</button></div>
</section>

<section id="scr-quiz" class="screen">
  <div class="qbar">
    <button class="iconbtn" id="q-back" aria-label="Zurück">✕</button>
    <div class="qtitle" id="q-title"></div>
    <button class="iconbtn" id="q-gloss" aria-label="Wörterbuch">📖</button>
    <div class="coins">🪙 <span id="q-coins">0</span></div>
  </div>
  <div class="progress" id="q-progress"></div>
  <div class="qwrap">
    <div class="card" id="q-card">
      <div class="qnum"><span id="q-num"></span><span class="qtype" id="q-type"></span></div>
      <div class="prompt" id="q-prompt"></div>
      <div class="visual" id="q-visual"></div>
      <div class="answer" id="q-answer"></div>
      <div class="feedback" id="q-fb"></div>
    </div>
  </div>
</section>

<section id="scr-game" class="screen">
  <div class="gbar">
    <button class="iconbtn" id="g-exit" aria-label="Beenden">✕</button>
    <span class="gt" id="g-title"></span>
  </div>

function animateFood(svg,lblEl,done){
  const food=svg.querySelector('.food'),trail=svg.querySelector('.trail');food.style.display='';
  const seg=[];let tot=0;for(let i=1;i<ROUTE.length;i++){const d=Math.hypot(ROUTE[i][0]-ROUTE[i-1][0],ROUTE[i][1]-ROUTE[i-1][1]);seg.push(d);tot+=d;}

  const step=ts=>{if(!svg.isConnected)return;if(t0===null)t0=ts;const f=Math.min(1,(ts-t0)/dur);let dist=f*tot,i=0;
    while(i<seg.length-1&&dist>seg[i]){dist-=seg[i];i++;}

function mkCls(id,n){const c=CLS[id];const items=[];const by=c.b.map((_,i)=>shuffle(c.items.filter(x=>x[2]===i)));
  let i=0;while(items.length<n){const b=by[i%by.length];if(b.length)items.push(b.pop());i++;if(i>100)break;}
  return {type:'cls',tag:'Sortieren',prompt:c.p,b:c.b,items:shuffle(items),binfo:c.info,pyr:!!c.pyr,hint:'Überlege: Wie oft sollte man das essen oder trinken?',info:'Alles richtig sortiert!'};}

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,delay,slide){const a=ac();if(!a||!SV.sound)return;const t=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);}
function noise(d,v){const a=ac();if(!a||!SV.sound)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=v||.15;s.connect(g);g.connect(a.destination);s.start();}

 whistle:()=>{tone(2200,.12,'sine',.06);tone(2400,.35,'sine',.06,.14)},crowd:()=>noise(1.2,.08),bounce:()=>tone(180,.08,'sine',.18,0,90),
 swish:()=>noise(.25,.1),rim:()=>tone(420,.18,'triangle',.08,0,300),

    txt(c,'CHV1995 · A DONDE VAYAS… ¡VE CON TODO!',W/2,92,20,'#fceb01','center',false);
    for(let i=0;i<12;i++){const y0=108+i*37;c.fillStyle=i%2?'#2e9e3e':'#36ad47';c.fillRect(0,y0,W,38);}
    c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=4;c.beginPath();c.moveTo(150,330);c.lineTo(810,330);c.moveTo(150,330);c.lineTo(60,540);c.moveTo(810,330);c.lineTo(900,540);
    c.moveTo(250,290);c.lineTo(710,290);c.stroke();

GAMES.shoot=function(){

  return {pad:[{k:'a',l:'Spring!'}],get dbg(){return {p,zone,dunks,state}},
  update(){
    if(msgT>0)msgT--;if(shake>0)shake--;if(net>0)net--;tm++;
    if(state==='end'){endT++;if(endT>80)G.win('3 Mates – Dani fliegt wie ein Profi! 🏀🔥');return;}
    if(ball){ball.vy+=.45;ball.x+=ball.vx;ball.y+=ball.vy;ball.rot+=.2;if(!ball.free){rim(RF,RY);rim(RB,RY);}
      if(ball.x+ball.r>BBX&&ball.y>RY-120&&ball.y<RY+22&&ball.vx>0){ball.x=BBX-ball.r;ball.vx*=-.6;sfx.rim();}
      if(ball.y+ball.r>FL){ball.y=FL-ball.r;ball.vy*=-.5;ball.vx*=.85;}}
    if(state==='run'){p.x+=p.vx;
      if((G.P.a||G.P.down)){p.air=true;p.vy=-11;p.t0=tm;state='jump';sfx.blip();
        p.ok=p.x>=zone.x&&p.x<=zone.x+zone.w;
        if(p.ok)p.vx=(IDEAL+140-p.x)/22;else fail=p.x<zone.x?'early':'late';}
      else if(p.x>zone.x+zone.w+70){state='miss';say('Spring in der grünen Zone! 🟩','#ffab40');tm=0;}
    }else if(state==='jump'){
      p.vy+=.5;p.x+=p.vx;p.y+=p.vy;const at=tm-p.t0;
      if(dunks===1&&p.ok)p.rot=Math.min(1,at/22)*Math.PI*2;
      if(p.ok&&at>=22){state='hang';tm=0;p.hx=(RF+RB)/2-35;p.hy=RY+165;shake=18;net=30;sfx.swish();sfx.crowd();say(NAMES[Math.min(dunks,2)],'#d9a441',90);
        ball={x:(RF+RB)/2,y:RY-4,vx:0,vy:3,r:15,rot:0,free:true};}
      else if(!p.ok&&at===22){ball={x:p.x+34,y:p.y-178,vx:fail==='early'?4.5:-1.5,vy:fail==='early'?-2:1,r:15,rot:0};
        say(fail==='early'?'Zu früh! ⏪':'Zu spät! ⏩','#ffab40');}
      if(p.y>=FL){p.y=FL;p.air=false;state='land';tm=0;}
    }else if(state==='hang'){
      p.x=p.hx;p.y=p.hy+Math.sin(tm*.4)*2;if(tm>34){state='jump2';p.vy=1;p.vx=1.2;}
    }else if(state==='jump2'){p.vy+=.5;p.y+=p.vy;p.x+=p.vx;if(p.y>=FL){p.y=FL;state='land';tm=0;dunks++;if(dunks>=3){state='end';endT=0;}}}
    else if(state==='land'){if(tm>55)reset();}
    else if(state==='miss'){p.x+=p.vx;if(tm>50)reset();}
  },
  draw(c){
    c.save();if(shake)c.translate(rnd(-6,6),rnd(-6,6));
    arena(c,W,FL,'CB ALCOBENDAS · MATE-SHOW');
    const flash=state==='run'&&G.t%30<20;c.fillStyle=flash?'rgba(0,230,118,.75)':'rgba(0,230,118,.45)';c.fillRect(zone.x,FL+2,zone.w,26);
    txt(c,'SPRING!',zone.x+zone.w/2,FL+48,20,'#00e676','center');
    hoop(c,RF,RB,RY,BBX,net);
    const hanging=state==='hang';
    let o={run:state==='run'||state==='miss',air:p.air||hanging||state==='jump2',rot:p.rot%(Math.PI*2)};
    if(state==='jump'||hanging||state==='jump2'){
      if(dunks===2&&p.ok&&state==='jump'){const a=-Math.PI+(tm-p.t0)/22*Math.PI*2;o.armR=a;}else{o.armR=-2.8;}o.armL=-2.6;}
    else o.armR=-.6;
    bbPlayer(c,p.x,p.y,1,o);
    const holding=!ball&&(state==='run'||state==='jump'||state==='miss');
    if(holding){let bx,by;
      if(state==='jump'){const ang=(o.armR||-2.8);bx=p.x+20+Math.sin(-ang)*44;by=p.y-126+Math.cos(ang)*44;
        if(o.rot){const cx=p.x,cy=p.y-80,dx=bx-cx,dy=by-cy;bx=cx+dx*Math.cos(o.rot)-dy*Math.sin(o.rot);by=cy+dx*Math.sin(o.rot)+dy*Math.cos(o.rot);}}
      else{bx=p.x+30;by=FL-20-Math.abs(Math.sin(G.t*.18))*70;}
      basketBall(c,bx,by,15,G.t*.1);}
    if(ball)basketBall(c,ball.x,ball.y,ball.r,ball.rot);
    c.strokeStyle='#ff5722';c.lineWidth=6;c.beginPath();c.moveTo(RF,RY+(hanging?6:0));c.lineTo(RB+6,RY);c.stroke();
    c.restore();
    rr(c,14,12,230,46,12);c.fillStyle='rgba(0,0,0,.6)';c.fill();txt(c,`🏀 MATES: ${dunks} / 3`,30,36,28,'#d9a441','left',false);
    if(state==='run'&&dunks===0&&G.t%80<55)txt(c,'Tippe in der grünen Zone! 🟩',W/2,300,30,'#fff');
    if(msgT>0)txt(c,msg,W/2,250,state==='hang'?84:60,msgC);
  }};
};

  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&!standalone&&!localStorage.getItem('dani-ios-tip-off')){$('#ios-tip').style.display='block';
    $('#ios-tip-x').onclick=()=>{$('#ios-tip').style.display='none';try{localStorage.setItem('dani-ios-tip-off','1')}catch(e){}};}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
renderHome();
